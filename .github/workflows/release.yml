# Builds installers when a version tag (e.g. v0.1.0) is pushed, and attaches
# them to a DRAFT GitHub Release in this (private) repo. Download the installers
# from the release page and install manually.
#
# Linux builds run on the self-hosted runner (label `plutus`), so they cost no
# GitHub-hosted minutes. The Windows build needs a hosted runner and is gated on
# the repo variable WINDOWS_CI=true.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (linux)
    runs-on: [self-hosted, linux, x64, plutus]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # The self-hosted runner has no `rpm` toolchain, so bundle deb + AppImage
      # only. RPM stays in tauri.conf.json for hosted builds.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Plutus v__VERSION__
          releaseBody: Download the installer for your platform below and install manually.
          releaseDraft: true
          prerelease: false
          args: --bundles deb,appimage

  build-windows:
    name: Build (windows)
    if: vars.WINDOWS_CI == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Plutus v__VERSION__
          releaseBody: Download the installer for your platform below and install manually.
          releaseDraft: true
          prerelease: false
