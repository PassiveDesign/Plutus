[package]
name = "plutus-core"
version = "0.1.0"
description = "Plutus core: encrypted storage and business logic (no GUI dependencies)"
authors = ["PassiveDesign"]
edition = "2024"
publish = false

[dependencies]
# SQLCipher (encrypted SQLite) compiled from source, with OpenSSL vendored so
# Windows and Linux builds need no system crypto libraries.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "chrono"] }
# Calendar dates only (no clock/timezone features needed).
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Bank exports (RFC 4180 quoting).
csv = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
